# Environnement de DÉVELOPPEMENT : PostgreSQL + Mailpit (boîte e-mail locale pour tester les notifications).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: prospectener
      POSTGRES_PASSWORD: prospectener_dev
      POSTGRES_DB: prospectener
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025" # SMTP (SMTP_HOST=127.0.0.1, SMTP_PORT=1025)
      - "127.0.0.1:8025:8025" # interface web http://localhost:8025
volumes:
  pgdata:
